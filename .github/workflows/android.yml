name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu-hosted runners already include an Android SDK; avoid re-downloading
      # command-line tools before compiling.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soundtrail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
