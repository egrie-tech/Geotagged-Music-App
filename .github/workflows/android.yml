name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu-hosted runners already include an Android SDK; avoid re-downloading
      # command-line tools before compiling.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee android-build.log; then
            echo "Build and unit tests passed."
          else
            # Expose useful diagnostics as a check annotation as well as in the runner log.
            # This also helps when an environment cannot download Actions log archives.
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('android-build.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if line.startswith(('e: ', 'error: ', '* What went wrong:', 'FAILURE:')) or ' FAILED' in line]
          excerpt = '\n'.join(errors[:50] if errors else lines[-60:])[:15000]
          escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android build failure::{escaped}')
          PY
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soundtrail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
